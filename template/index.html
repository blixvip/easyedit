<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>easyedit</title>
<style>
@font-face { font-family: EECaption; src: url('fonts/Montserrat.ttf'); font-weight: 100 900; }
@font-face { font-family: EEDisplay; src: url('fonts/Anton.ttf'); }
@font-face { font-family: EESerif; font-style: italic; src: url('fonts/PlayfairDisplay-Italic.ttf'); font-weight: 400 900; }
@font-face { font-family: EETrailer; src: url('fonts/Cinzel.ttf'); font-weight: 400 900; }
@font-face { font-family: EEType; src: url('fonts/SpecialElite.ttf'); }
@font-face { font-family: EEVhs; src: url('fonts/VT323.ttf'); }
@font-face { font-family: EEScript; src: url('fonts/Caveat.ttf'); font-weight: 400 700; }
@font-face { font-family: EEMarker; src: url('fonts/PermanentMarker.ttf'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: __W__px; height: __H__px; background: #000; overflow: hidden; }
#stage { position: relative; width: __W__px; height: __H__px; overflow: hidden; background: #000; }
#depth { position: absolute; left: 0; top: 0; width: __DW__px; height: __DH__px; opacity: 0; }
#footage { position: absolute; inset: 0; width: __W__px; height: __H__px; object-fit: cover; }
#gl { position: absolute; inset: 0; width: __W__px; height: __H__px; }
#fx { position: absolute; inset: 0; width: __W__px; height: __H__px; pointer-events: none; }
</style>
</head>
<body>
<main id="stage" data-composition-id="easyedit" data-start="0" data-duration="__DURATION__"
      data-width="__W__" data-height="__H__" data-fps="__FPS__" data-no-timeline>
  <video id="footage" class="clip" src="footage.mp4" data-start="0" data-duration="__DURATION__"
         data-media-start="__MEDIA_START__" data-track-index="0" muted playsinline preload="auto"></video>
__DEPTH__
  <canvas id="gl" class="clip" width="__W__" height="__H__" data-start="0" data-duration="__DURATION__"
          data-track-index="2"></canvas>
  <canvas id="fx" class="clip" width="__W__" height="__H__" data-start="0" data-duration="__DURATION__"
          data-track-index="3"></canvas>
</main>
<script>window.SEGMENT_START = __SEGMENT_START__;</script>
<script src="edit.js"></script>
<script src="film.js"></script>
</body>
</html>
