<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easyedit</title>
<style>
  :root {
    --bg: #0b0c0f; --panel: #14161b; --panel-2: #1b1e25; --line: #272b34;
    --text: #eef0f4; --dim: #9aa2b1; --accent: #ffe27a; --good: #8dff8a; --bad: #ff5570;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    padding: 28px 22px 80px; max-width: 1180px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  h1 { font-size: 26px; letter-spacing: -0.5px; margin: 0; }
  h1 span { color: var(--accent); }
  header p { color: var(--dim); margin: 0; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .prompt { display: flex; gap: 10px; }
  input, select { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font: inherit; width: 100%; }
  input:focus, select:focus { outline: 2px solid #46506a; }
  button { background: var(--accent); color: #17181c; border: 0; border-radius: 10px; padding: 12px 20px;
    font: 600 15px/1 "Segoe UI", system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  button.ghost:hover { color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .opts { margin-top: 14px; display: none; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .opts.open { display: grid; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; letter-spacing: .3px; }
  .toggle { margin-top: 12px; background: none; border: 0; color: var(--dim); font-size: 13px; padding: 0; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 10px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim);
       margin: 34px 0 12px; font-weight: 600; }
  .runs { display: grid; gap: 12px; }
  .bar { height: 6px; background: #23262e; border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--good));
           transition: width .5s ease; }
  pre { background: #0e1014; border: 1px solid var(--line); border-radius: 10px; margin: 10px 0 0;
        padding: 10px 12px; max-height: 190px; overflow: auto; font: 12px/1.55 ui-monospace, Consolas, monospace;
        color: #b9c0cc; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
          display: flex; flex-direction: column; }
  .tile .thumb { aspect-ratio: 16/9; background: #05060a center/cover no-repeat; cursor: pointer; position: relative; }
  .tile .thumb::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 30px; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.8); opacity: .88; }
  .tile .thumb.empty::after { content: ""; }
  .tile .body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .tile h3 { margin: 0; font-size: 16px; }
  .meta { color: var(--dim); font-size: 12.5px; }
  .scene { color: #7f879a; font-size: 11.5px; letter-spacing: .4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }
  .tile .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .tile .actions button { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--accent);
          border: 1px solid #3a3722; background: #241f0f; border-radius: 99px; padding: 2px 9px; }
  .pill.err { color: var(--bad); border-color: #40222a; background: #26141a; }
  dialog { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 16px;
           padding: 0; max-width: min(1100px, 92vw); }
  dialog::backdrop { background: rgba(2,3,6,.78); }
  dialog video { display: block; width: 100%; max-height: 74vh; background: #000; }
  dialog .bottom { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .empty-state { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>easy<span>edit</span></h1>
  <p>type a movie, get a captioned speech + beat-cut montage</p>
</header>

<div class="card">
  <form class="prompt" id="form">
    <input id="movie" placeholder="Movie name — e.g. Gladiator" autocomplete="off" autofocus>
    <button id="go">Make the edit</button>
  </form>
  <button class="toggle" type="button" id="toggle">Options ▾</button>
  <div class="opts" id="opts">
    <div><label>Speech scene (file, URL or search)</label><input id="speech" placeholder="auto"></div>
    <div><label>Montage sources (comma separated)</label><input id="montage" placeholder="auto"></div>
    <div><label>Song (file, URL or search)</label><input id="music" placeholder="auto"></div>
    <div><label>Frame rate</label><select id="fps"><option value="">60 (default)</option><option>30</option><option>24</option></select></div>
    <div><label>Montage seconds</label><input id="montage_length" placeholder="21" inputmode="decimal"></div>
    <div><label>Final shot seconds</label><input id="hero_length" placeholder="3.4" inputmode="decimal"></div>
    <div><label>Writer</label><select id="llm"><option value="">auto</option><option>claude</option><option>codex</option><option>none</option></select></div>
    <div><label>Speed</label><select id="draft"><option value="">full quality</option><option value="1">draft (30fps, fast)</option></select></div>
  </div>
</div>

<div id="runsWrap" hidden>
  <h2>Working</h2>
  <div class="runs" id="runs"></div>
</div>

<h2>Edits</h2>
<div class="grid" id="grid"></div>
<p class="empty-state" id="empty" hidden>No edits yet. Type a movie name above — the first run downloads footage, so give it ~15 minutes.</p>

<dialog id="player">
  <video id="video" controls></video>
  <div class="bottom"><strong id="playerTitle"></strong><button class="ghost" id="closePlayer">Close</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const api = (url, body) => fetch(url, body ? {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
} : undefined).then(r => r.json());

const fmt = s => s == null ? '' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const ago = t => {
  const m = (Date.now() / 1000 - t) / 60;
  if (m < 1) return 'just now';
  if (m < 60) return `${Math.round(m)}m ago`;
  if (m < 1440) return `${Math.round(m / 60)}h ago`;
  return `${Math.round(m / 1440)}d ago`;
};

$('toggle').onclick = () => {
  const open = $('opts').classList.toggle('open');
  $('toggle').textContent = open ? 'Options ▴' : 'Options ▾';
};

$('form').onsubmit = async e => {
  e.preventDefault();
  const movie = $('movie').value.trim();
  if (!movie) return;
  $('go').disabled = true;
  const res = await api('/api/new', {
    movie,
    speech: $('speech').value.trim() || null,
    music: $('music').value.trim() || null,
    montage: $('montage').value.split(',').map(s => s.trim()).filter(Boolean),
    fps: $('fps').value || null,
    montage_length: $('montage_length').value || null,
    hero_length: $('hero_length').value || null,
    llm: $('llm').value || null,
    draft: !!$('draft').value,
  });
  $('go').disabled = false;
  if (res.error) return alert(res.error);
  $('movie').value = '';
  openLogs.add(res.slug);
  refresh();
};

const openLogs = new Set();

function runCard(job) {
  const pct = Math.round((job.progress || 0) * 100);
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>${job.title}</strong>
      <span class="pill ${job.error ? 'err' : ''}">${job.error ? 'error' : job.stage || 'working'}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row" style="justify-content:space-between">
      <span class="meta">${pct}%</span>
      <span class="row">
        <button class="ghost" data-log="${job.slug}">${openLogs.has(job.slug) ? 'Hide log' : 'Show log'}</button>
        <button class="ghost" data-stop="${job.slug}">Stop</button>
      </span>
    </div>
    ${openLogs.has(job.slug) ? `<pre id="log-${job.slug}">loading…</pre>` : ''}
  </div>`;
}

function tile(job) {
  const thumb = job.thumb ? `background-image:url('${job.thumb}?t=${Math.round(job.updated)}')` : '';
  return `<div class="tile">
    <div class="thumb ${job.video ? '' : 'empty'}" style="${thumb}" ${job.video ? `data-play="${job.slug}"` : ''}></div>
    <div class="body">
      <h3>${job.title}</h3>
      <div class="meta">${job.video ? `${fmt(job.duration)} · ${job.size} MB · ${ago(job.updated)}`
                                    : `${job.running ? job.stage || 'working' : 'not rendered'} · ${ago(job.updated)}`}</div>
      ${job.scene ? `<div class="scene">${job.scene}</div>` : ''}
      <div class="actions">
        ${job.video ? `<button data-play="${job.slug}">Play</button>` : ''}
        <button class="ghost" data-again="${job.title}">Re-run</button>
        <button class="ghost" data-folder="${job.slug}">Folder</button>
        <button class="ghost" data-delete="${job.slug}">Delete</button>
      </div>
    </div>
  </div>`;
}

let jobs = [];
async function refresh() {
  const data = await api('/api/jobs');
  jobs = data.jobs || [];
  const running = jobs.filter(j => j.running);
  $('runsWrap').hidden = !running.length;
  $('runs').innerHTML = running.map(runCard).join('');
  $('grid').innerHTML = jobs.map(tile).join('');
  $('empty').hidden = jobs.length > 0;
  running.forEach(j => openLogs.has(j.slug) && pullLog(j.slug));
}

async function pullLog(slug) {
  const el = $(`log-${slug}`);
  if (!el) return;
  const data = await api(`/api/log/${slug}`);
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.textContent = data.log || '(no output yet)';
  if (atBottom) el.scrollTop = el.scrollHeight;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-play]');
  if (!b) return;
  const d = b.dataset;
  if (d.play) {
    const job = jobs.find(j => j.slug === d.play);
    $('video').src = job.video;
    $('playerTitle').textContent = job.title;
    $('player').showModal();
    $('video').play();
  } else if (d.log) {
    openLogs.has(d.log) ? openLogs.delete(d.log) : openLogs.add(d.log);
    refresh();
  } else if (d.stop) {
    await api('/api/stop', { slug: d.stop });
    refresh();
  } else if (d.folder) {
    api('/api/reveal', { slug: d.folder });
  } else if (d.again) {
    $('movie').value = d.again;
    $('movie').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (d.delete) {
    const job = jobs.find(j => j.slug === d.delete);
    if (confirm(`Delete "${job.title}" and everything downloaded for it?`)) {
      await api('/api/delete', { slug: d.delete });
      refresh();
    }
  }
});

$('closePlayer').onclick = () => { $('video').pause(); $('player').close(); };
$('player').addEventListener('close', () => { $('video').pause(); $('video').removeAttribute('src'); });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
